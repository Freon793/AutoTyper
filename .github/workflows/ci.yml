name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    name: cargo test (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain version
        run: |
          rustc --version
          cargo --version

      - name: Check formatting
        run: cargo fmt --check

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose
