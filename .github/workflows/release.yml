name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    name: Build and publish Windows EXE
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run tests before packaging
        run: python -m pytest tests -v

      - name: Build EXE with PyInstaller
        run: >
          python -m PyInstaller --onefile --windowed --name AutoTyper
          --exclude-module PyQt5 --exclude-module numpy --exclude-module cv2
          --exclude-module PIL --exclude-module pyscreenshot --exclude-module pymsgbox
          --exclude-module pytweening --exclude-module pygetwindow --exclude-module pyrect
          --exclude-module pyScreeze --exclude-module mouseinfo
          main.py

      - name: Rename artifact with version and platform
        run: Move-Item dist/AutoTyper.exe "dist/AutoTyper-${{ github.ref_name }}-win64.exe"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AutoTyper-*-win64.exe
          generate_release_notes: true
