name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    name: Build and publish Windows EXE
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain version
        run: |
          rustc --version
          cargo --version

      - name: Run tests before packaging
        run: cargo test --verbose

      - name: Build release EXE
        run: cargo build --release --verbose

      - name: Rename artifact with version and platform
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Move-Item target/release/AutoTyper.exe "dist/AutoTyper-${{ github.ref_name }}-win64.exe"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AutoTyper-*-win64.exe
          generate_release_notes: true
