name: 功能建议
description: 提出新功能或改进建议
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 该建议针对什么场景下的什么问题
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议的方案
      description: 描述你期望的功能形态
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 可选
  - type: checkboxes
    id: duplicate
    attributes:
      label: 查重确认
      options:
        - label: 我已搜索现有 Issue，确认没有重复建议
          required: true
